<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="940" height="440" fill="#fff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a6fb0"/></marker>
  </defs>

  <!-- ===== Panel A: I-V curve of D1 ===== -->
  <text x="230" y="28" text-anchor="middle" font-size="16" font-weight="bold">(a) D1, PESD5V0L1ULD: current vs voltage</text>
  <!-- normal region -->
  <rect x="70" y="60" width="126" height="300" fill="#e8f4ea"/>
  <text x="133" y="80" text-anchor="middle" font-size="12" fill="#2e7d32">normal VBUS</text>
  <text x="133" y="95" text-anchor="middle" font-size="12" fill="#2e7d32">0–5 V: ≤ 100 nA</text>
  <!-- axes -->
  <line x1="70" y1="360" x2="410" y2="360" stroke="#000" stroke-width="1.5"/>
  <line x1="70" y1="360" x2="70" y2="55" stroke="#000" stroke-width="1.5"/>
  <text x="410" y="395" text-anchor="end" font-size="12">voltage across D1 (V)</text>
  <text x="30" y="210" text-anchor="middle" font-size="12" transform="rotate(-90 30 210)">current (A)</text>
  <!-- x ticks: 0..14 V -> 70..410, 24.3 px/V -->
  <g font-size="11" text-anchor="middle">
    <line x1="70" y1="360" x2="70" y2="365" stroke="#000"/><text x="70" y="378">0</text>
    <line x1="191.5" y1="360" x2="191.5" y2="365" stroke="#000"/><text x="191.5" y="378">5</text>
    <line x1="313" y1="360" x2="313" y2="365" stroke="#000"/><text x="313" y="378">10</text>
  </g>
  <!-- y ticks: 0..4 A -> 360..60, 75 px/A -->
  <g font-size="11" text-anchor="end">
    <line x1="65" y1="285" x2="70" y2="285" stroke="#000"/><text x="62" y="289">1</text>
    <line x1="65" y1="210" x2="70" y2="210" stroke="#000"/><text x="62" y="214">2</text>
    <line x1="65" y1="135" x2="70" y2="135" stroke="#000"/><text x="62" y="139">3</text>
  </g>
  <!-- curve: (0,0) (6.4,0) (7.2,0.05) (9,1) (12,3.5) -->
  <path d="M70,360 L230,360 Q270,358 288.7,285 L361.6,97.5" fill="none" stroke="#c0392b" stroke-width="3"/>
  <!-- markers -->
  <line x1="191.5" y1="360" x2="191.5" y2="60" stroke="#555" stroke-dasharray="4 4"/>
  <line x1="235" y1="360" x2="235" y2="150" stroke="#555" stroke-dasharray="4 4"/>
  <line x1="361.6" y1="360" x2="361.6" y2="97.5" stroke="#555" stroke-dasharray="4 4"/>
  <circle cx="288.7" cy="285" r="4" fill="#c0392b"/>
  <circle cx="361.6" cy="97.5" r="4" fill="#c0392b"/>
  <text x="200" y="130" font-size="12">V<tspan font-size="9" dy="3">RWM</tspan><tspan dy="-3"> = 5 V</tspan></text>
  <text x="240" y="165" font-size="12">V<tspan font-size="9" dy="3">BR</tspan><tspan dy="-3"> = 6.4–7.2 V</tspan></text>
  <text x="298" y="290" font-size="12">≤ 9 V at 1 A</text>
  <text x="352" y="90" font-size="12" text-anchor="end">≤ 12 V at 3.5 A</text>
  <text x="240" y="422" text-anchor="middle" font-size="12" fill="#555">Below VBR the diode is practically open; above it, V ≈ VBR + Rdyn · I.</text>

  <line x1="470" y1="20" x2="470" y2="420" stroke="#ddd" stroke-width="2"/>

  <!-- ===== Panel B: USBLC6 topology ===== -->
  <text x="705" y="28" text-anchor="middle" font-size="16" font-weight="bold">(b) U1, USBLC6-2: rail-to-rail clamp</text>
  <g stroke="#000" stroke-width="2" fill="none">
    <line x1="560" y1="90" x2="870" y2="90"/>
    <line x1="560" y1="330" x2="870" y2="330"/>
    <!-- column I/O1 x=620 -->
    <line x1="620" y1="90" x2="620" y2="140"/><line x1="620" y1="165" x2="620" y2="260"/><line x1="620" y1="285" x2="620" y2="330"/>
    <!-- column I/O2 x=740 -->
    <line x1="740" y1="90" x2="740" y2="140"/><line x1="740" y1="165" x2="740" y2="260"/><line x1="740" y1="285" x2="740" y2="330"/>
    <!-- zener x=840 -->
    <line x1="840" y1="90" x2="840" y2="198"/><line x1="840" y1="223" x2="840" y2="330"/>
    <!-- I/O taps -->
    <line x1="500" y1="212" x2="620" y2="212"/>
    <line x1="740" y1="212" x2="780" y2="212"/>
  </g>
  <g fill="#000">
    <!-- diodes pointing up: triangle base (lower) apex (upper) -->
    <polygon points="608,165 632,165 620,141"/><rect x="606" y="138" width="28" height="3"/>
    <polygon points="608,285 632,285 620,261"/><rect x="606" y="258" width="28" height="3"/>
    <polygon points="728,165 752,165 740,141"/><rect x="726" y="138" width="28" height="3"/>
    <polygon points="728,285 752,285 740,261"/><rect x="726" y="258" width="28" height="3"/>
    <polygon points="828,223 852,223 840,199"/><rect x="826" y="196" width="28" height="3"/>
    <circle cx="620" cy="212" r="4"/><circle cx="740" cy="212" r="4"/>
    <circle cx="620" cy="90" r="4"/><circle cx="740" cy="90" r="4"/><circle cx="840" cy="90" r="4"/>
    <circle cx="620" cy="330" r="4"/><circle cx="740" cy="330" r="4"/><circle cx="840" cy="330" r="4"/>
  </g>
  <line x1="826" y1="197" x2="820" y2="191" stroke="#000" stroke-width="3"/>
  <line x1="854" y1="197" x2="860" y2="203" stroke="#000" stroke-width="3"/>
  <text x="560" y="80" font-size="13" font-weight="bold">VBUS (pin 5)</text>
  <text x="560" y="352" font-size="13" font-weight="bold">GND (pin 2)</text>
  <text x="503" y="205" font-size="11">I/O1 · pins 1, 6</text>
  <text x="752" y="205" font-size="11">I/O2</text><text x="752" y="248" font-size="10" fill="#555">pins 3, 4</text>
  <text x="866" y="215" font-size="12">Zener</text>
  <text x="866" y="230" font-size="10" fill="#555">V<tspan font-size="8" dy="2">BR</tspan><tspan dy="-2"> ≈ 6 V</tspan></text>
  <!-- surge paths -->
  <polyline points="505,180 606,180 606,100 830,100 830,318" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#ar)"/>
  <polyline points="634,318 634,226 510,226" fill="none" stroke="#2a6fb0" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#ab)"/>
  <text x="705" y="385" text-anchor="middle" font-size="12" fill="#c0392b">positive spike: I/O → upper diode → VBUS → Zener → GND</text>
  <text x="705" y="405" text-anchor="middle" font-size="12" fill="#2a6fb0">negative spike: GND → lower diode → I/O</text>
</svg>
