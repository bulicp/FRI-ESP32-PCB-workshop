<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="920" height="400" fill="#fff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="h" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>
  <!-- IC outline -->
  <rect x="200" y="55" width="460" height="290" rx="10" fill="#f4f6f9" stroke="#8a95a5" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="215" y="338" font-size="13" fill="#6a7585">inside the XC6220</text>

  <g stroke="#000" stroke-width="2" fill="none">
    <!-- VIN line -->
    <line x1="40" y1="100" x2="290" y2="100"/>
    <!-- VOUT line -->
    <line x1="390" y1="100" x2="880" y2="100"/>
    <!-- GND rail -->
    <line x1="40" y1="360" x2="880" y2="360"/>
    <!-- CIN -->
    <line x1="120" y1="100" x2="120" y2="215"/><line x1="100" y1="215" x2="140" y2="215"/>
    <line x1="100" y1="227" x2="140" y2="227"/><line x1="120" y1="227" x2="120" y2="360"/>
    <!-- CL -->
    <line x1="720" y1="100" x2="720" y2="215"/><line x1="700" y1="215" x2="740" y2="215"/>
    <line x1="700" y1="227" x2="740" y2="227"/><line x1="720" y1="227" x2="720" y2="360"/>
    <!-- load -->
    <line x1="830" y1="100" x2="830" y2="190"/><line x1="830" y1="250" x2="830" y2="360"/>
    <!-- divider R1 R2 at x=560 -->
    <line x1="560" y1="100" x2="560" y2="125"/>
    <path d="M560,125 l-8,5 l16,10 l-16,10 l16,10 l-16,10 l16,10 l-8,5"/>
    <line x1="560" y1="185" x2="560" y2="240"/>
    <path d="M560,240 l-8,5 l16,10 l-16,10 l16,10 l-16,10 l16,10 l-8,5"/>
    <line x1="560" y1="300" x2="560" y2="360"/>
    <!-- FB to amp (-) -->
    <line x1="560" y1="212" x2="490" y2="212"/>
    <!-- Vref to amp (+) -->
    <line x1="490" y1="252" x2="520" y2="252"/><line x1="520" y1="252" x2="520" y2="285"/>
    <line x1="520" y1="315" x2="520" y2="360"/>
    <!-- amp output to gate -->
    <line x1="410" y1="232" x2="340" y2="232"/><line x1="340" y1="232" x2="340" y2="148"/>
  </g>
  <!-- pass transistor box -->
  <rect x="290" y="75" width="100" height="50" rx="6" fill="#dfe8f5" stroke="#000" stroke-width="2"/>
  <text x="340" y="96" text-anchor="middle" font-size="12" font-weight="bold">P-MOSFET</text>
  <text x="340" y="112" text-anchor="middle" font-size="11">pass transistor</text>
  <line x1="340" y1="125" x2="340" y2="148" stroke="#000" stroke-width="2"/>
  <text x="348" y="143" font-size="11" fill="#444">gate (G)</text>
  <text x="282" y="93" font-size="13" font-weight="bold" text-anchor="end" fill="#2a4d8f">S</text>
  <text x="398" y="93" font-size="13" font-weight="bold" fill="#2a4d8f">D</text>
  <!-- error amp triangle pointing left -->
  <polygon points="410,232 490,192 490,272" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="478" y="217" font-size="14" text-anchor="end">+</text>
  <text x="478" y="258" font-size="14" text-anchor="end">−</text>
  <text x="450" y="290" text-anchor="middle" font-size="11" fill="#444">error amplifier</text>
  <!-- Vref source -->
  <circle cx="520" cy="300" r="15" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="520" y="305" text-anchor="middle" font-size="11">ref</text>
  <text x="578" y="230" font-size="12" fill="#444">FB</text>
  <text x="574" y="160" font-size="12">R1</text>
  <text x="574" y="285" font-size="12">R2</text>
  <text x="498" y="304" font-size="11" fill="#444" text-anchor="end">VREF</text>
  <!-- dots -->
  <g fill="#000">
    <circle cx="120" cy="100" r="4"/><circle cx="560" cy="100" r="4"/><circle cx="720" cy="100" r="4"/><circle cx="830" cy="100" r="4"/>
    <circle cx="560" cy="212" r="4"/>
    <circle cx="120" cy="360" r="4"/><circle cx="520" cy="360" r="4"/><circle cx="560" cy="360" r="4"/><circle cx="720" cy="360" r="4"/><circle cx="830" cy="360" r="4"/>
  </g>
  <!-- load box -->
  <rect x="800" y="190" width="60" height="60" rx="5" fill="#eefaf0" stroke="#000" stroke-width="2"/>
  <text x="830" y="216" text-anchor="middle" font-size="11">load</text>
  <text x="830" y="232" text-anchor="middle" font-size="10">ESP32-C3</text>
  <!-- labels -->
  <text x="40" y="88" font-size="13" font-weight="bold">VIN (pin 1): VBUS, 5 V</text>
  <text x="880" y="88" font-size="13" font-weight="bold" text-anchor="end">VOUT (pin 5): +3.3 V</text>
  <text x="40" y="385" font-size="13" font-weight="bold">GND (pin 2)</text>
  <text x="148" y="226" font-size="12">C1</text><text x="148" y="242" font-size="10" fill="#444">10 µF</text>
  <text x="748" y="226" font-size="12">C2</text><text x="748" y="242" font-size="10" fill="#444">4.7 µF</text>
  <!-- heat annotation -->
  <path d="M320,70 q10,-12 0,-24 q-10,-12 0,-24" fill="none" stroke="#c0392b" stroke-width="2"/>
  <path d="M345,70 q10,-12 0,-24 q-10,-12 0,-24" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="400" y="36" font-size="12" fill="#c0392b">(V<tspan font-size="9" dy="2">IN</tspan><tspan dy="-2"> − V</tspan><tspan font-size="9" dy="2">OUT</tspan><tspan dy="-2">) · I  →  heat</tspan></text>
  <!-- CE -->
  <text x="215" y="290" font-size="11" fill="#444">CE (pin 3): switches</text>
  <text x="215" y="304" font-size="11" fill="#444">the whole regulator on/off</text>
  <!-- load current arrow -->
  <line x1="600" y1="80" x2="680" y2="80" stroke="#555" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="640" y="72" text-anchor="middle" font-size="11" fill="#555">load current I</text>
</svg>
