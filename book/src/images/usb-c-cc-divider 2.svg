<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="500" fill="#ffffff"/>
  <defs>
    <path id="res" d="m0,0 l5,-8 l10,16 l10,-16 l10,16 l10,-16 l10,16 l10,-16 l10,16 l5,-8" fill="none"/>
  </defs>

  <!-- HOST / SOURCE -->
  <rect x="20" y="40" width="270" height="330" rx="10" fill="#eef4fb" stroke="#3a6ea5" stroke-width="2"/>
  <text x="155" y="68" text-anchor="middle" font-size="17" font-weight="bold" fill="#3a6ea5">HOST (source)</text>
  <text x="70" y="108" text-anchor="middle" font-size="14" font-weight="bold">+5 V</text>
  <line x1="70" y1="115" x2="70" y2="290" stroke="#000" stroke-width="2"/>
  <circle cx="70" cy="170" r="3.5"/>
  <!-- Rp1 -->
  <line x1="70" y1="170" x2="120" y2="170" stroke="#000" stroke-width="2"/>
  <use href="#res" x="120" y="170" stroke="#000" stroke-width="2"/>
  <line x1="200" y1="170" x2="280" y2="170" stroke="#000" stroke-width="2"/>
  <text x="160" y="152" text-anchor="middle" font-size="14" font-weight="bold">Rp</text>
  <!-- Rp2 -->
  <line x1="70" y1="290" x2="120" y2="290" stroke="#000" stroke-width="2"/>
  <use href="#res" x="120" y="290" stroke="#000" stroke-width="2"/>
  <line x1="200" y1="290" x2="280" y2="290" stroke="#000" stroke-width="2"/>
  <text x="160" y="272" text-anchor="middle" font-size="14" font-weight="bold">Rp</text>
  <text x="160" y="205" text-anchor="middle" font-size="12" fill="#444">56 k / 22 k / 10 k</text>
  <text x="160" y="220" text-anchor="middle" font-size="12" fill="#444">(advertises current)</text>
  <circle cx="280" cy="170" r="6" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="280" cy="290" r="6" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="270" y="158" text-anchor="end" font-size="13" font-weight="bold">CC1</text>
  <text x="270" y="278" text-anchor="end" font-size="13" font-weight="bold">CC2</text>

  <!-- CABLE -->
  <rect x="320" y="100" width="260" height="312" rx="16" fill="none" stroke="#777" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="450" y="125" text-anchor="middle" font-size="16" font-weight="bold" fill="#555">Cable</text>
  <line x1="286" y1="170" x2="614" y2="170" stroke="#c0392b" stroke-width="3"/>
  <text x="450" y="160" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="bold">the single CC wire</text>
  <!-- VCONN side with optional Ra -->
  <line x1="286" y1="290" x2="345" y2="290" stroke="#999" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="345" y1="290" x2="345" y2="295" stroke="#999" stroke-width="2" stroke-dasharray="4 3"/>
  <g transform="translate(345,295) rotate(90)"><use href="#res" stroke="#999" stroke-width="2"/></g>
  <line x1="345" y1="375" x2="345" y2="385" stroke="#999" stroke-width="2"/>
  <line x1="333" y1="385" x2="357" y2="385" stroke="#999" stroke-width="2"/>
  <line x1="338" y1="391" x2="352" y2="391" stroke="#999" stroke-width="2"/>
  <line x1="342" y1="397" x2="348" y2="397" stroke="#999" stroke-width="2"/>
  <text x="365" y="315" font-size="12" fill="#888">Ra ≈ 1 kΩ, only in</text>
  <text x="365" y="330" font-size="12" fill="#888">e-marked cables (VCONN)</text>
  <text x="560" y="283" text-anchor="end" font-size="12" fill="#888">not wired through</text>

  <!-- OUR BOARD / SINK -->
  <rect x="610" y="40" width="270" height="330" rx="10" fill="#eefaf0" stroke="#2e8b57" stroke-width="2"/>
  <text x="745" y="68" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e8b57">OUR BOARD (sink)</text>
  <circle cx="620" cy="170" r="6" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="620" cy="290" r="6" fill="#fff" stroke="#000" stroke-width="2"/>
  <text x="632" y="158" font-size="13" font-weight="bold">CC1</text>
  <text x="632" y="278" font-size="13" font-weight="bold">CC2</text>
  <!-- Rd1 -->
  <line x1="626" y1="170" x2="700" y2="170" stroke="#000" stroke-width="2"/>
  <use href="#res" x="700" y="170" stroke="#000" stroke-width="2"/>
  <line x1="780" y1="170" x2="830" y2="170" stroke="#000" stroke-width="2"/>
  <text x="740" y="152" text-anchor="middle" font-size="14" font-weight="bold">Rd 5.1 kΩ</text>
  <!-- Rd2 -->
  <line x1="626" y1="290" x2="700" y2="290" stroke="#000" stroke-width="2"/>
  <use href="#res" x="700" y="290" stroke="#000" stroke-width="2"/>
  <line x1="780" y1="290" x2="830" y2="290" stroke="#000" stroke-width="2"/>
  <text x="740" y="272" text-anchor="middle" font-size="14" font-weight="bold">Rd 5.1 kΩ</text>
  <line x1="830" y1="170" x2="830" y2="330" stroke="#000" stroke-width="2"/>
  <circle cx="830" cy="290" r="3.5"/>
  <line x1="814" y1="330" x2="846" y2="330" stroke="#000" stroke-width="2"/>
  <line x1="820" y1="337" x2="840" y2="337" stroke="#000" stroke-width="2"/>
  <line x1="826" y1="344" x2="834" y2="344" stroke="#000" stroke-width="2"/>
  <text x="740" y="205" text-anchor="middle" font-size="12" fill="#444">V(CC) ≈ 0.42 / 0.94 / 1.69 V</text>
  <text x="740" y="220" text-anchor="middle" font-size="12" fill="#444">for Rp = 56 k / 22 k / 10 k</text>

  <!-- WHO MEASURES WHAT -->
  <text x="155" y="405" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a6ea5">Source measures CC1 and CC2:</text>
  <text x="155" y="425" text-anchor="middle" font-size="13">open → nothing attached</text>
  <text x="155" y="443" text-anchor="middle" font-size="13">Rd → sink attached, switch VBUS on</text>
  <text x="155" y="461" text-anchor="middle" font-size="13">which pin sees Rd → plug orientation</text>
  <text x="155" y="479" text-anchor="middle" font-size="13">Ra → cable/accessory, not a sink</text>

  <text x="745" y="405" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e8b57">Sink may measure CC:</text>
  <text x="745" y="425" text-anchor="middle" font-size="13">0.20–0.66 V → default (500/900 mA)</text>
  <text x="745" y="443" text-anchor="middle" font-size="13">0.66–1.23 V → 1.5 A</text>
  <text x="745" y="461" text-anchor="middle" font-size="13">1.23–2.04 V → 3.0 A</text>
  <text x="745" y="479" text-anchor="middle" font-size="13" font-style="italic" fill="#555">our board ignores this</text>
</svg>
